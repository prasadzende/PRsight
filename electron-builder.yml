appId: com.prsight.app
productName: PRsight
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!scripts/*'
  - '!docs/*'
  - '!{electron.vite.config.ts,vitest.config.ts,playwright.config.ts,eslint.config.mjs,tsconfig*.json,*.tsbuildinfo,.prettierrc,.editorconfig,.nvmrc}'
  - '!{CLAUDE.md,README.md,CONTRIBUTING.md,CODE_OF_CONDUCT.md,SECURITY.md,CHANGELOG.md}'
  - '!.github/*'
asarUnpack:
  - '**/*.node'
# PRsight-0.1.27-mac-arm64.dmg, PRsight-0.1.27-win-x64.exe, …
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Apple Silicon and Intel. The zip is what the in-app update check reads (latest-mac.yml).
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned: ad-hoc signature only (no paid Apple Developer ID), so no hardened runtime or notarisation.
  identity: '-'
  hardenedRuntime: false
  notarize: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
linux:
  icon: build/icon.png
  target: [AppImage]
# New versions are published to GitHub Releases by .github/workflows/release.yml.
# The app checks the latest release for updates (see src/main/updates.ts).
publish:
  provider: github
  owner: prasadzende
  repo: PRsight
  releaseType: draft
