<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3B1D9A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris" cx=".42" cy=".38" r=".75">
      <stop offset="0" stop-color="#5B4CF0"/>
      <stop offset="1" stop-color="#2A1580"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  </g>
  <!-- eye -->
  <path d="M212 512 C 318 300, 706 300, 812 512 C 706 724, 318 724, 212 512 Z" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="142" fill="url(#iris)"/>
  <!-- PR graph in the iris: two commits on a branch, merging into a third -->
  <g stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" fill="none">
    <path d="M462 452 V572"/>
    <path d="M562 452 C 562 520, 462 512, 462 572"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="462" cy="452" r="27"/>
    <circle cx="562" cy="452" r="27"/>
    <circle cx="462" cy="572" r="27"/>
  </g>
</svg>
